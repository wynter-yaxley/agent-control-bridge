<svg xmlns="http://www.w3.org/2000/svg" width="960" height="550" viewBox="0 0 960 550" role="img" aria-labelledby="title desc">
  <title id="title">Hermes → ChatGPT → Codex 工作流</title>
  <desc id="desc">用户把任务交给 Hermes；Hermes 复用对话，请 ChatGPT 制定方案，把方案转给 Codex 实施，再请 ChatGPT 复核，最后向用户汇报。</desc>
  <style>
    text { font-family: 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', 'Noto Sans SC', 'Source Han Sans SC', 'Segoe UI', sans-serif; fill: #1f2933; }
    .h { font-size: 16px; font-weight: 600; }
    .m { font-size: 13px; }
    .n { font-size: 12px; fill: #52606d; }
    .life { stroke: #9aa5b1; stroke-width: 1.2; stroke-dasharray: 4 4; }
    .go { stroke: #3b4a59; stroke-width: 1.6; fill: none; }
    .back { stroke: #3b4a59; stroke-width: 1.4; stroke-dasharray: 6 4; fill: none; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b4a59"/>
    </marker>
  </defs>
  <rect width="960" height="550" fill="#f8fafc"/>

  <rect x="540" y="70" width="120" height="425" fill="#fff4e0"/>
  <rect x="780" y="70" width="120" height="425" fill="#e3f8ec"/>

  <rect x="60" y="20" width="120" height="44" rx="8" fill="#ffffff" stroke="#9aa5b1"/>
  <text class="h" x="120" y="48" text-anchor="middle">用户</text>
  <rect x="300" y="20" width="120" height="44" rx="8" fill="#ffffff" stroke="#9aa5b1"/>
  <text class="h" x="360" y="48" text-anchor="middle">Hermes</text>
  <rect x="540" y="20" width="120" height="44" rx="8" fill="#ffffff" stroke="#d9822b"/>
  <text class="h" x="600" y="48" text-anchor="middle">ChatGPT</text>
  <rect x="780" y="20" width="120" height="44" rx="8" fill="#ffffff" stroke="#2f9e63"/>
  <text class="h" x="840" y="48" text-anchor="middle">Codex</text>

  <line class="life" x1="120" y1="64" x2="120" y2="495"/>
  <line class="life" x1="360" y1="64" x2="360" y2="495"/>
  <line class="life" x1="600" y1="64" x2="600" y2="495"/>
  <line class="life" x1="840" y1="64" x2="840" y2="495"/>

  <path class="go" d="M120,110 L356,110" marker-end="url(#arrow)"/>
  <text class="m" x="240" y="101" text-anchor="middle">1 任务</text>

  <path class="go" d="M360,145 C410,145 410,187 364,187" marker-end="url(#arrow)"/>
  <text class="m" x="420" y="152">2 复用现有对话</text>
  <text class="n" x="420" y="170">acb_threads</text>
  <text class="n" x="420" y="186">acb_codex_find</text>

  <path class="go" d="M360,220 L596,220" marker-end="url(#arrow)"/>
  <text class="m" x="480" y="211" text-anchor="middle">3 acb_gpt_send：需求</text>
  <path class="back" d="M600,255 L364,255" marker-end="url(#arrow)"/>
  <text class="m" x="480" y="246" text-anchor="middle">方案</text>

  <path class="go" d="M360,300 L836,300" marker-end="url(#arrow)"/>
  <text class="m" x="720" y="291" text-anchor="middle">4 acb_codex_send：方案 + 任务</text>
  <path class="back" d="M840,335 L364,335" marker-end="url(#arrow)"/>
  <text class="m" x="720" y="326" text-anchor="middle">代码 · 命令 · 测试结果</text>

  <path class="go" d="M360,380 L596,380" marker-end="url(#arrow)"/>
  <text class="m" x="480" y="371" text-anchor="middle">5 acb_gpt_send：复核</text>
  <path class="back" d="M600,415 L364,415" marker-end="url(#arrow)"/>
  <text class="m" x="480" y="406" text-anchor="middle">复核意见</text>

  <path class="back" d="M360,460 L124,460" marker-end="url(#arrow)"/>
  <text class="m" x="240" y="451" text-anchor="middle">6 关键进度与结果</text>

  <text class="n" x="600" y="522" text-anchor="middle">前台：输入时占用键盘焦点</text>
  <text class="n" x="840" y="522" text-anchor="middle">后台：不影响用户操作</text>
</svg>
