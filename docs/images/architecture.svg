<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Agent Control Bridge 架构</title>
  <desc id="desc">MCP 客户端按需调用 ACB 的独立工具；ACB 经 Codex App Server、Native IPC 和 UIA 三条通道连接 ChatGPT/Codex 桌面应用。</desc>
  <style>
    text { font-family: 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', 'Noto Sans SC', 'Source Han Sans SC', 'Segoe UI', sans-serif; fill: #1f2933; }
    .h { font-size: 17px; font-weight: 600; }
    .s { font-size: 13px; fill: #52606d; }
    .l { font-size: 12px; fill: #52606d; }
    .box { fill: #ffffff; stroke: #9aa5b1; stroke-width: 1.5; }
    .bg { fill: #e3f8ec; stroke: #2f9e63; stroke-width: 1.5; }
    .ro { fill: #e8f1fd; stroke: #3b7dd8; stroke-width: 1.5; }
    .fg { fill: #fff4e0; stroke: #d9822b; stroke-width: 1.5; }
    .line { stroke: #616e7c; stroke-width: 1.6; fill: none; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#616e7c"/>
    </marker>
  </defs>
  <rect width="960" height="420" fill="#f8fafc"/>

  <rect class="box" x="30" y="150" width="180" height="110" rx="10"/>
  <text class="h" x="120" y="192" text-anchor="middle">MCP 客户端</text>
  <text class="s" x="120" y="216" text-anchor="middle">Hermes 或其他</text>
  <text class="s" x="120" y="238" text-anchor="middle">按需调用单个工具</text>

  <path class="line" d="M210,205 L268,205" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text class="l" x="239" y="194" text-anchor="middle">MCP</text>

  <rect class="box" x="270" y="120" width="240" height="170" rx="10"/>
  <text class="h" x="390" y="168" text-anchor="middle">ACB MCP Server</text>
  <text class="s" x="390" y="194" text-anchor="middle">Node.js · stdio</text>
  <text class="s" x="390" y="216" text-anchor="middle">14 个独立工具 · 逐个执行</text>
  <text class="s" x="390" y="238" text-anchor="middle">身份核对 · 不重复发送</text>
  <text class="s" x="390" y="260" text-anchor="middle">进程常驻复用</text>

  <path class="line" d="M510,190 C550,190 550,75 598,75" marker-end="url(#arrow)"/>
  <path class="line" d="M510,205 L598,210" marker-end="url(#arrow)"/>
  <path class="line" d="M510,220 C550,220 550,345 598,345" marker-end="url(#arrow)"/>

  <rect class="bg" x="600" y="30" width="330" height="90" rx="10"/>
  <text class="h" x="765" y="66" text-anchor="middle">Codex App Server → Codex 对话</text>
  <text class="s" x="765" y="92" text-anchor="middle">列出 · 搜索 · 读取 · 新建 · 发送（后台无窗口）</text>

  <rect class="ro" x="600" y="165" width="330" height="90" rx="10"/>
  <text class="h" x="765" y="201" text-anchor="middle">Native IPC → 桌面应用</text>
  <text class="s" x="765" y="227" text-anchor="middle">codex-app-tools 管道 · 清单 · 读取 GPT 对话 · 改名</text>

  <rect class="fg" x="600" y="300" width="330" height="90" rx="10"/>
  <text class="h" x="765" y="336" text-anchor="middle">UIA + SendInput → ChatGPT 窗口</text>
  <text class="s" x="765" y="362" text-anchor="middle">打开 · 新建 · 发送 GPT 对话（输入时需在前台）</text>

  <rect class="bg" x="30" y="330" width="14" height="14" rx="3"/>
  <text class="l" x="52" y="342">后台运行</text>
  <rect class="ro" x="130" y="330" width="14" height="14" rx="3"/>
  <text class="l" x="152" y="342">只读查询</text>
  <rect class="fg" x="230" y="330" width="14" height="14" rx="3"/>
  <text class="l" x="252" y="342">前台 / 占用输入焦点</text>
</svg>
