<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 790" role="img" aria-labelledby="title desc"><title id="title">Agent Control Bridge architecture</title><desc id="desc">Feishu users request work through Hermes. ChatGPT generates prompts, the bridge verifies and relays to Codex. SQLite stores the ledger, Watcher observes state, and an independent Hermes reviewer alone accepts success.</desc><style>.bg{fill:#f8fafc}.node{fill:#fff;stroke:#64748b;stroke-width:1.5}.text{fill:#172554;font-family:Arial,"Microsoft YaHei",sans-serif}.small{font-size:13px}.heading{font-size:18px;font-weight:bold}@media(prefers-color-scheme:dark){.bg{fill:#0f172a}.node{fill:#1e293b;stroke:#94a3b8}.text{fill:#f1f5f9}}</style><rect width="1000" height="790" rx="18" class="bg" fill="#f8fafc" /><defs><marker id="req" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" /></marker><marker id="prompt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb" /></marker><marker id="state" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#059669" /></marker><marker id="review" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9333ea" /></marker></defs><rect x="400" y="35" width="220" height="76" rx="12" class="node" fill="#ffffff" stroke="#64748b" stroke-width="1.5" /><text x="510.0" y="66" text-anchor="middle" class="text heading" fill="#172554" font-family="Arial,Microsoft YaHei,sans-serif" font-size="18" font-weight="bold">飞书用户 / User</text><text x="510.0" y="90" text-anchor="middle" class="text small" fill="#172554" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13">需求、进度与最终结果</text><rect x="400" y="155" width="220" height="76" rx="12" class="node" fill="#ffffff" stroke="#64748b" stroke-width="1.5" /><text x="510.0" y="186" text-anchor="middle" class="text heading" fill="#172554" font-family="Arial,Microsoft YaHei,sans-serif" font-size="18" font-weight="bold">Hermes</text><text x="510.0" y="210" text-anchor="middle" class="text small" fill="#172554" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13">协调中枢 / Controller</text><rect x="80" y="320" width="220" height="76" rx="12" class="node" fill="#ffffff" stroke="#64748b" stroke-width="1.5" /><text x="190.0" y="351" text-anchor="middle" class="text heading" fill="#172554" font-family="Arial,Microsoft YaHei,sans-serif" font-size="18" font-weight="bold">ChatGPT</text><text x="190.0" y="375" text-anchor="middle" class="text small" fill="#172554" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13">生成工程 Prompt / GPT-6 High*</text><rect x="400" y="320" width="220" height="76" rx="12" class="node" fill="#ffffff" stroke="#64748b" stroke-width="1.5" /><text x="510.0" y="351" text-anchor="middle" class="text heading" fill="#172554" font-family="Arial,Microsoft YaHei,sans-serif" font-size="18" font-weight="bold">Agent Control Bridge</text><text x="510.0" y="375" text-anchor="middle" class="text small" fill="#172554" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13">来源验证、中转、状态与授权</text><rect x="720" y="320" width="220" height="76" rx="12" class="node" fill="#ffffff" stroke="#64748b" stroke-width="1.5" /><text x="830.0" y="351" text-anchor="middle" class="text heading" fill="#172554" font-family="Arial,Microsoft YaHei,sans-serif" font-size="18" font-weight="bold">Codex</text><text x="830.0" y="375" text-anchor="middle" class="text small" fill="#172554" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13">执行者 / Executor</text><rect x="400" y="550" width="220" height="76" rx="12" class="node" fill="#ffffff" stroke="#64748b" stroke-width="1.5" /><text x="510.0" y="581" text-anchor="middle" class="text heading" fill="#172554" font-family="Arial,Microsoft YaHei,sans-serif" font-size="18" font-weight="bold">SQLite</text><text x="510.0" y="605" text-anchor="middle" class="text small" fill="#172554" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13">任务、Prompt、事件、验收台账</text><rect x="720" y="550" width="220" height="76" rx="12" class="node" fill="#ffffff" stroke="#64748b" stroke-width="1.5" /><text x="830.0" y="581" text-anchor="middle" class="text heading" fill="#172554" font-family="Arial,Microsoft YaHei,sans-serif" font-size="18" font-weight="bold">Watcher</text><text x="830.0" y="605" text-anchor="middle" class="text small" fill="#172554" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13">事件触发 + 60 秒兜底轮询</text><rect x="80" y="550" width="240" height="76" rx="12" class="node" fill="#ffffff" stroke="#64748b" stroke-width="1.5" /><text x="200.0" y="581" text-anchor="middle" class="text heading" fill="#172554" font-family="Arial,Microsoft YaHei,sans-serif" font-size="18" font-weight="bold">独立验收入口</text><text x="200.0" y="605" text-anchor="middle" class="text small" fill="#172554" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13">Hermes Reviewer / 独立身份</text><path d="M 475 111 L 475 155" fill="none" stroke="#64748b" stroke-width="2" /><text x="490" y="137" class="text small" fill="#172554" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13">任务需求</text><path d="M 550 155 L 550 111" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="7 5" /><text x="566" y="137" class="text small" fill="#172554" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13">最终结果</text><path d="M 400 190 L 190 190 L 190 320" fill="none" stroke="#64748b" stroke-width="2" /><text x="220" y="181" class="text small" fill="#172554" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13">请求生成 Prompt</text><path d="M 190 260 L 55 260 L 55 588 L 80 588" fill="none" stroke="#9333ea" stroke-width="2" stroke-dasharray="7 5" /><text x="63" y="485" class="text small" fill="#172554" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13">独立验收</text><circle cx="190" cy="260" r="4" fill="#9333ea" /><path d="M 300 347 L 400 347" fill="none" stroke="#2563eb" stroke-width="2" /><text x="314" y="338" class="text small" fill="#172554" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13">生成产物</text><path d="M 620 347 L 720 347" fill="none" stroke="#2563eb" stroke-width="2" /><text x="634" y="338" class="text small" fill="#172554" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13">验证后投递</text><path d="M 455 231 L 455 320" fill="none" stroke="#64748b" stroke-width="2" /><text x="362" y="283" class="text small" fill="#172554" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13">任务元数据</text><path d="M 555 320 L 555 231" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="7 5" /><text x="565" y="283" class="text small" fill="#172554" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13">状态同步</text><path d="M 490 396 L 490 550" fill="none" stroke="#64748b" stroke-width="2" /><text x="420" y="478" class="text small" fill="#172554" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13">持久化</text><path d="M 530 550 L 530 396" fill="none" stroke="#64748b" stroke-width="2" /><text x="542" y="495" class="text small" fill="#172554" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13">读取台账</text><path d="M 830 396 L 830 445 L 600 445 L 600 396" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="7 5" /><text x="640" y="434" class="text small" fill="#172554" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13">执行状态 / 交付</text><path d="M 620 588 L 720 588" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="7 5" /><text x="651" y="578" class="text small" fill="#172554" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13">读取</text><path d="M 940 588 L 973 588 L 973 193 L 620 193" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="7 5" /><text x="790" y="181" class="text small" fill="#172554" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13">上报进度</text><path d="M 320 588 L 350 588 L 350 378 L 400 378" fill="none" stroke="#9333ea" stroke-width="2" stroke-dasharray="7 5" /><text x="263" y="500" class="text small" fill="#172554" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13">授权验收</text><text x="60" y="683" class="text small" fill="#172554" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13">铁律：执行者只能提交 WAITING_APPROVAL；独立验收是 SUCCEEDED 的唯一入口。</text><text x="60" y="709" class="text small" fill="#172554" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13">* GPT-6 / High 是默认请求配置，真实能力无法验证时拒绝自动执行；Demo 明确使用 Mock。</text><line x1="60" y1="747" x2="95" y2="747" stroke="#64748b" stroke-width="3" /><text x="105" y="752" class="text small" fill="#172554" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13">需求 / 台账</text><line x1="285" y1="747" x2="320" y2="747" stroke="#2563eb" stroke-width="3" /><text x="330" y="752" class="text small" fill="#172554" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13">Prompt</text><line x1="510" y1="747" x2="545" y2="747" stroke="#059669" stroke-width="3" stroke-dasharray="7 5" /><text x="555" y="752" class="text small" fill="#172554" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13">状态</text><line x1="735" y1="747" x2="770" y2="747" stroke="#9333ea" stroke-width="3" stroke-dasharray="7 5" /><text x="780" y="752" class="text small" fill="#172554" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13">验收</text><polygon points="475.0,155.0 479.0,146.0 471.0,146.0" fill="#64748b" /><polygon points="550.0,111.0 546.0,120.0 554.0,120.0" fill="#059669" /><polygon points="190.0,320.0 194.0,311.0 186.0,311.0" fill="#64748b" /><polygon points="80.0,588.0 71.0,584.0 71.0,592.0" fill="#9333ea" /><polygon points="400.0,347.0 391.0,343.0 391.0,351.0" fill="#2563eb" /><polygon points="720.0,347.0 711.0,343.0 711.0,351.0" fill="#2563eb" /><polygon points="455.0,320.0 459.0,311.0 451.0,311.0" fill="#64748b" /><polygon points="555.0,231.0 551.0,240.0 559.0,240.0" fill="#059669" /><polygon points="490.0,550.0 494.0,541.0 486.0,541.0" fill="#64748b" /><polygon points="530.0,396.0 526.0,405.0 534.0,405.0" fill="#64748b" /><polygon points="600.0,396.0 596.0,405.0 604.0,405.0" fill="#059669" /><polygon points="720.0,588.0 711.0,584.0 711.0,592.0" fill="#059669" /><polygon points="620.0,193.0 629.0,197.0 629.0,189.0" fill="#059669" /><polygon points="400.0,378.0 391.0,374.0 391.0,382.0" fill="#9333ea" /></svg>