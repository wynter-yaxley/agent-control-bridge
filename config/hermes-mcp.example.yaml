# Merge into the Hermes profile. Paths are placeholders, not secrets.
mcp_servers:
  acb:
    command: "${ACB_NODE_EXECUTABLE}"
    args: ["${ACB_MCP_ENTRY}", "--config", "${ACB_CONFIG_PATH}"]
    enabled: true
    # One send waits up to timeoutMs (300 s) for the reply, plus a margin.
    timeout: 400
    connect_timeout: 30
    supports_parallel_tool_calls: false
    tools:
      include: [acb_threads, acb_gpt_send, acb_codex_send]
      resources: false
      prompts: false
